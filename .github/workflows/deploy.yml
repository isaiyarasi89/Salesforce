name: Deploy to Salesforce Org

# Runs whenever main is updated. You can narrow this later (e.g. only when
# force-app/ changes) once the basic flow is working.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The actual SFDX project (sfdx-project.json, force-app) lives inside
        # this subfolder, not at the repo root - so every step below runs
        # from here.
        working-directory: my-salesforce-org
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Write JWT key to a file
        # GitHub Secrets can't be used as file paths directly, so we write
        # the secret's contents out to a temp file the CLI can read.
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      - name: Authenticate to target org via JWT
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url https://tpicap-dev-ed.develop.my.salesforce.com \
            --alias target-org \
            --set-default

      - name: Deploy metadata (dry run first)
        # Validates the deploy without actually pushing changes - a safety
        # check before the real deploy below. Remove this step once you
        # trust the pipeline, or keep it permanently as a safeguard.
        run: sf project deploy start --source-dir cpq-app --dry-run --target-org target-org

      - name: Deploy metadata (real deploy)
        run: sf project deploy start --source-dir cpq-app --target-org target-org

      # --- Data import, in dependency order ---
      # ⚠️ Plan file NAMES below are my best guess based on sf's default
      # naming pattern (<RootObjectApiName>-plan.json). Run 'ls data/*'
      # locally first to confirm the actual names match before relying on
      # this — if they don't, just correct the path in the matching step.

      - name: "Stage 1 - Import Products, Features, Options, and Price Book Entries"
        # These must import together in one call so cross-references (Option
        # -> Product2, Price Book Entry -> Product2) resolve correctly.
        # Separate calls can't see each other's newly-created record Ids.
        run: sf data import tree --plan data/productCatalog/plan.json --target-org target-org

      - name: "Stage 2 - Import Product Rules (+ Product Actions, Error Conditions)"
        run: sf data import tree --plan data/productRule/SBQQ__ProductRule__c-plan.json --target-org target-org

      - name: "Stage 3 - Import Price Rules (+ Price Conditions, Price Actions)"
        run: sf data import tree --plan data/priceRule/SBQQ__PriceRule__c-plan.json --target-org target-org

      - name: Clean up JWT key file
        if: always()
        run: rm -f server.key